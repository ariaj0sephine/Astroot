<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: transparent; }
        #sky { width: 100vw; height: 100vh; background: transparent; }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-geo-projection@4"></script>
</head>
<body>

<svg id="sky" viewBox="0 0 1000 500"></svg>

<script>
    const width = 1000, height = 500;
    const svg = d3.select("#sky");

    const projection = d3.geoOrthographic()
      .scale(200)
      .translate([width / 2, height / 2])
      .clipAngle(90);

    const path = d3.geoPath().projection(projection);

    const constLines = {
      Ori: [
        [88.79, 7.41],
        [91.89, 14.77],
        [88.79, 7.41],
        [84.05, -1.20],
        [84.72, -1.94],
        [85.19, -2.40],
        [84.05, -1.20],
        [78.63, -8.20],
        [88.79, 7.41],
        [83.00, -5.92]
      ],
      Gem: [
        [114.83, 5.22],
        [116.33, 31.89],
        [113.65, 27.26],
        [116.33, 31.89],
        [100.98, 22.52],
        [116.33, 31.89],
        [105.83, 16.40]
      ],
      Tau: [
        [81.57, 28.61],
        [79.17, 45.99],
        [68.98, 16.51],
        [81.57, 28.61],
        [67.17, 15.87],
        [64.95, 15.63]
      ],
      Per: [
        [75.70, 55.90],
        [87.25, 52.75],
        [75.70, 55.90],
        [77.00, 40.85],
        [75.70, 55.90],
        [59.80, 39.78]
      ],
      UMa: [
        [165.93, 61.75],
        [159.02, 54.93],
        [165.93, 61.75],
        [153.11, 49.31],
        [178.46, 53.69],
        [176.14, 57.03]
      ],
      Lyr: [
        [279.23, 38.78],
        [278.32, 38.92],
        [279.23, 38.78],
        [280.02, 38.78],
        [279.23, 38.78],
        [282.52, 33.36],
        [284.08, 34.75]
      ],
      Cyg: [
        [308.79, 40.15],
        [301.53, 36.82],
        [308.79, 40.15],
        [293.15, 45.98],
        [299.42, 35.08],
        [304.21, 45.28]
      ],
      Sco: [
        [247.35, -26.43],
        [245.98, -25.59],
        [247.35, -26.43],
        [252.17, -37.10],
        [250.97, -37.29]
      ],
      Leo: [
        [152.09, 11.97],
        [148.15, 23.72],
        [152.09, 11.97],
        [167.60, 14.57]
      ],
      Cas: [
        [28.60, 63.67],
        [21.45, 60.24],
        [14.18, 60.72],
        [10.13, 56.54],
        [2.29, 59.15]
      ],
      Aur: [
        [89.88, 44.95],
        [79.17, 46.00],
        [76.63, 41.23],
        [74.25, 33.17],
        [81.57, 28.61],
        [89.93, 37.21]
      ],
      Peg: [
        [8.72, 29.42],
        [13.24, 15.19],
        [0.14, 15.20],
        [346.20, 28.08],
        [8.72, 29.42]
      ],
      And: [
        [8.72, 29.42],
        [5.99, 30.79],
        [8.72, 29.42],
        [65.82, 35.62]
      ],
      CMa: [
        [101.29, -16.72],
        [100.98, -22.52],
        [101.29, -16.72],
        [105.43, -28.97]
      ],
      Boo: [
        [213.92, 19.18],
        [210.95, 32.35],
        [213.92, 19.18],
        [218.00, 27.71]
      ]
    };

    for (let c in constLines) {
      svg.append("path")
        .datum({
          type: "LineString",
          coordinates: constLines[c]
        })
        .attr("d", path)
        .attr("stroke", "cyan")
        .attr("stroke-width", 3)
        .attr("fill", "none");
    }

    function rotateSky(heading) {
      projection.rotate([heading, 0]);
      svg.selectAll("path").attr("d", path);
    }

    window.addEventListener("message", e => {
      if (typeof e.data === "string" && e.data.startsWith("rotate:")) {
        rotateSky(parseFloat(e.data.split(":")[1]));
      }
    });

    rotateSky(0);
    window.parent.postMessage('skyLoaded', '*');
</script>

</body>
</html>
